[workspace]
resolver = "2"
members = ["wordclock-core", "wordclock-host", "wordclock-esp32"]
# The ESP32-C3 spike crates are standalone: they have their own lockfiles and
# targets, and they are reference material rather than workspace members.
exclude = ["spike"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
