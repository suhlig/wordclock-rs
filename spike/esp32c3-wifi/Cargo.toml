[package]
edition      = "2024"
name         = "esp32c3-wifi"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "esp32c3-wifi"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32c3", "log-04", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c3",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c3", "log-04"] }
log                    = "0.4.27"

embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "dns",
  "log",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = { version = "0.11.0", features = ["esp32c3", "internal-heap-stats"] }
esp-backtrace = { version = "0.20.0", features = [
  "esp32c3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.18.0", features = ["esp32c3", "log-04"] }
# for more networking protocol support see https://crates.io/crates/edge-net
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-radio = { version = "1.0.0-beta.1", features = [
  "esp-alloc",
  "esp32c3",
  "log-04",
  "unstable",
  "wifi",
] }
smoltcp = { version = "0.14.0", default-features = false, features = [
  "log",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }
sntpc = { version = "0.11", default-features = false }
sntpc-net-embassy = { version = "0.11", default-features = false }

critical-section = "1.2.0"
static_cell      = "2.1.1"
esp-hal-smartled = { version = "0.18.0", features = ["esp32c3"] }
smart-leds = "0.4.0"

# The core modules used by the host, compiled without std for the C3.
chrono   = { version = "0.4", default-features = false, features = ["alloc"] }
computus = "2"
fastrand = { version = "2", default-features = false, features = ["alloc"] }
libm     = "0.2"


[features]
# Present so the `#[cfg(feature = "std")]` gates shared with the host crate
# are well formed. It stays off: the firmware seeds its own RNG.
std = []
reconnect-test = []

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
