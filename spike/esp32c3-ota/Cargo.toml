[package]
edition      = "2024"
name         = "esp32c3-ota"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "esp32c3-ota"
path = "./src/bin/main.rs"

[dependencies]
wordclock-core = { path = "../../wordclock-core", default-features = false }
wordclock-esp32 = { path = "../../wordclock-esp32" }
esp-hal = { version = "~1.2.2", features = ["esp32c3", "log-04", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c3",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c3", "log-04"] }
# Not used directly: listed to turn on `esp-storage`'s critical-section support,
# which wraps every erase and write so no interrupt handler can execute from
# flash while the cache is off.
esp-storage = { version = "0.10.0", default-features = false, features = [
  "critical-section",
  "esp32c3",
] }
log = "0.4.27"

embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "dns",
  "log",
  "medium-ethernet",
  "tcp",
  "udp",
] }
esp-alloc = { version = "0.11.0", features = ["esp32c3", "internal-heap-stats"] }
esp-backtrace = { version = "0.20.0", features = [
  "esp32c3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.18.0", features = ["esp32c3", "log-04"] }
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-radio = { version = "1.0.0-beta.1", features = [
  "esp-alloc",
  "esp32c3",
  "log-04",
  "unstable",
  "wifi",
] }
smoltcp = { version = "0.14.0", default-features = false, features = [
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-tcp",
  "socket-udp",
] }

# Plain SNTP over UDP for the wall-location survey: the status page has to say
# whether the clock is synchronized, and there is no other time source in this
# image yet.
sntpc = { version = "0.11", default-features = false }
sntpc-net-embassy = { version = "0.11", default-features = false }

critical-section = "1.2.0"
static_cell      = "2.1.1"
esp-hal-smartled = { version = "0.18.0", features = ["esp32c3"] }
smart-leds       = "0.4.0"

# The core modules used by the host, compiled without std for the C3.
chrono   = { version = "0.4", default-features = false, features = ["alloc"] }
computus = "2"
fastrand = { version = "2", default-features = false, features = ["alloc"] }
libm     = "0.2"

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[features]
# Present so the `#[cfg(feature = "std")]` gates in the shared core modules are
# well formed. It stays off: the firmware seeds its own RNG.
std = []
# Drive the offcut strip on GPIO3 through the level shifter with a short
# pattern, for wiring and power checks. The OTA server stays available.
strip-check = []
# Render the 06:30 fixture frame with the real core and serve it at `GET /frame`
# so it can be diffed against `examples/dump_frame.rs`. Implies strip-check.
frame-check = ["strip-check"]
# Fill every pixel with one identical colour and cycle the primaries. The frame
# the clock renders is uniform already, so any pixel that looks different here
# is a wiring or timing problem and not a colour choice. Implies strip-check.
fill-check = ["strip-check"]
# Walk one pixel at a time in the colour the fixture frame really renders, so a
# sweep carries the same payload the failing frame does. The dim walk and the
# fill both send sparse bits and therefore cannot clear a dense payload.
# Implies strip-check.
dense-check = ["strip-check"]
# Hold a fixed run of known colours at the start of the chain, so the physical
# pixel can be read back against the logical one. Implies strip-check.
identity-check = ["strip-check"]
# Drive a 35-pixel offcut from the synchronized clock, drop Wi-Fi on a timer and
# blank once the time is too old, so the outage behaviour is observable on the
# bench instead of on the household access point. Implies strip-check.
outage-check = ["strip-check"]
# Alternate the fixture frame's own colour with black down the whole chain, so
# every pixel is followed by a dark one. The stray that the four-bit cell fixed
# landed on the pixel after any pixel ending in a `1`; a uniform fill hides it
# because every pixel receives the same stray. Implies strip-check.
boundary-check = ["strip-check"]

[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
