[package]
name = "wordclock-host"
version = "0.1.0"
edition = "2024"
description = "Word clock daemon, simulator, and CLI for the host and the Pi fallback"
license = "MIT OR Apache-2.0"
repository = "https://github.com/suhlig/wordclock-rs"
readme = "../README.md"

[[bin]]
name = "wordclock"
path = "src/main.rs"

[features]
default = ["std"]
std = ["wordclock-core/std"]
hardware = ["dep:rppal"]

[dependencies]
wordclock-core = { path = "../wordclock-core", default-features = false }
anyhow = "1"
chrono = { version = "0.4", features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

rppal = { version = "0.22", features = ["hal"], optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"
